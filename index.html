<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP8266 Remote Control</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #1a1a2e;
            color: #ffffff;
            padding: 40px 20px;
        }
        .card {
            background: #16213e;
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            max-width: 400px;
            width: 100%;
        }
        h2 { color: #00fff5; margin-bottom: 5px; }
        p { color: #a2a8d3; }
        .status-box {
            font-size: 18px;
            margin: 20px 0;
            padding: 10px;
            background: #0f3460;
            border-radius: 8px;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: 0.3s;
        }
        .btn-on { background-color: #00b4d8; color: white; }
        .btn-on:hover { background-color: #90e0ef; color: black; }
        .btn-off { background-color: #e63946; color: white; }
        .btn-off:hover { background-color: #ff758f; }
    </style>
</head>
<body>

    <div class="card">
        <h2>ESP8266 Remote Control</h2>
        <p>Blynk IoT Dashboard</p>
        
        <div class="status-box">
            நிலை (Status): <strong id="pinStatus">சரிபார்க்கிறது...</strong>
        </div>
        
        <button class="btn-on" onclick="controlRelay(1)">ON</button>
        <button class="btn-off" onclick="controlRelay(0)">OFF</button>
    </div>

    <script>
        const AUTH_TOKEN = 'Jk0S_2J5BMkXFVLvjUSJq6XufxZHQdjH';
        const VIRTUAL_PIN = 'V0';

        function controlRelay(value) {
            const url = `https://blynk.cloud/external/api/update?token=${AUTH_TOKEN}&${VIRTUAL_PIN}=${value}`;
            fetch(url)
                .then(response => {
                    if (response.ok) {
                        document.getElementById('pinStatus').innerText = value === 1 ? 'ON' : 'OFF';
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        function getStatus() {
            const url = `https://blynk.cloud/external/api/get?token=${AUTH_TOKEN}&${VIRTUAL_PIN}`;
            fetch(url)
                .then(response => response.text())
                .then(data => {
                    document.getElementById('pinStatus').innerText = data.trim() === '1' ? 'ON' : 'OFF';
                })
                .catch(() => {
                    document.getElementById('pinStatus').innerText = 'இணைக்க முடியவில்லை';
                });
        }

        // பக்கம் திறந்தவுடன் நிலையை புதுப்பிக்க
        getStatus();
    </script>

</body>
</html>
