<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP8266 Control Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #1a1a2e;
            color: #ffffff;
            padding: 40px 20px;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .card {
            background: #16213e;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            width: 300px;
            margin: 10px;
        }
        h2 { color: #00fff5; margin-bottom: 5px; }
        h3 { color: #e94560; margin-bottom: 15px; }
        p { color: #a2a8d3; }
        .status-box {
            font-size: 16px;
            margin: 15px 0;
            padding: 10px;
            background: #0f3460;
            border-radius: 8px;
        }
        button {
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            margin: 8px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: 0.3s;
        }
        .btn-on { background-color: #00b4d8; color: white; }
        .btn-on:hover { background-color: #90e0ef; color: black; }
        .btn-off { background-color: #e63946; color: white; }
        .btn-off:hover { background-color: #ff758f; }
    </style>
</head>
<body>

    <h2>ESP8266 Remote Control Panel</h2>
    <p>Blynk IoT Web Dashboard</p>

    <div class="container">
        <!-- Light Control Card -->
        <div class="card">
            <h3>Light Control</h3>
            <div class="status-box">
                Status: <strong id="lightStatus">Checking...</strong>
            </div>
            <button class="btn-on" onclick="controlDevice(LIGHT_CONTROL_PIN, 1, LIGHT_STATUS_PIN, 'lightStatus')">ON</button>
            <button class="btn-off" onclick="controlDevice(LIGHT_CONTROL_PIN, 0, LIGHT_STATUS_PIN, 'lightStatus')">OFF</button>
        </div>

        <!-- Buzzer Control Card -->
        <div class="card">
            <h3>Buzzer Control</h3>
            <div class="status-box">
                Status: <strong id="buzzerStatus">Checking...</strong>
            </div>
            <button class="btn-on" onclick="controlDevice(BUZZER_CONTROL_PIN, 1, BUZZER_STATUS_PIN, 'buzzerStatus')">ON</button>
            <button class="btn-off" onclick="controlDevice(BUZZER_CONTROL_PIN, 0, BUZZER_STATUS_PIN, 'buzzerStatus')">OFF</button>
        </div>
    </div>

    <script>
        const AUTH_TOKEN = 'Jk0S_2J5BMkXFVLvjUSJq6XufxZHQdjH';
        
        // Pins configuration
        const LIGHT_CONTROL_PIN = 'V0';
        const BUZZER_CONTROL_PIN = 'V1';
        const LIGHT_STATUS_PIN = 'V2';
        const BUZZER_STATUS_PIN = 'V3';

        function controlDevice(controlPin, value, statusPin, elementId) {
            const url = `https://blynk.cloud/external/api/update?token=${AUTH_TOKEN}&${controlPin}=${value}`;
            fetch(url)
                .then(response => {
                    if (response.ok) {
                        setTimeout(() => getStatus(statusPin, elementId), 500);
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        function getStatus(statusPin, elementId) {
            const url = `https://blynk.cloud/external/api/get?token=${AUTH_TOKEN}&${statusPin}`;
            fetch(url)
                .then(response => response.text())
                .then(data => {
                    document.getElementById(elementId).innerText = data.trim() === '1' ? 'ON' : 'OFF';
                })
                .catch(() => {
                    document.getElementById(elementId).innerText = 'Disconnected';
                });
        }

        // Fetch status every 3 seconds automatically
        setInterval(() => {
            getStatus(LIGHT_STATUS_PIN, 'lightStatus');
            getStatus(BUZZER_STATUS_PIN, 'buzzerStatus');
        }, 3000);

        // Initial check
        getStatus(LIGHT_STATUS_PIN, 'lightStatus');
        getStatus(BUZZER_STATUS_PIN, 'buzzerStatus');
    </script>

</body>
</html>
